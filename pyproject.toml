[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazarpulse"
version = "0.1.0"
description = "Self-running forecasts of Dhaka's essential-goods prices from TCB's daily price sheets"
requires-python = ">=3.11"
authors = [{ name = "Sakib Raihan" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
