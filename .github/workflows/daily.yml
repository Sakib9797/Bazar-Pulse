name: Daily pipeline

on:
  schedule:
    - cron: "0 8 * * *"     # 14:00 Bangladesh time; TCB publishes around 12:30
    - cron: "0 11 * * *"    # 17:00 retry for late uploads
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -e .
      - name: Fetch, validate, score and forecast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bazarpulse.pipeline
      - name: Commit new data and forecasts
        run: |
          git config user.name "Sakib9797"
          git config user.email "166163857+Sakib9797@users.noreply.github.com"
          git add data models reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily update: TCB data and forecasts $(date -u +%F)"
          git pull --rebase
          git push
